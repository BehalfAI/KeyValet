name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace --locked
        working-directory: rust
      - run: scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Check release notes exist
        run: test -f ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/keyvalet-$GITHUB_REF_NAME-macos-arm64.tar.gz" dist/SHA256SUMS --draft --verify-tag --title "KeyValet $GITHUB_REF_NAME" --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
