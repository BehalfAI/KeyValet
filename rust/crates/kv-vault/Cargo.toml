[package]
name = "kv-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kv-i18n = { path = "../kv-i18n" }
aes-gcm = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
