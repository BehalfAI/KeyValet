[package]
name = "kv-agent"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kv-i18n = { path = "../kv-i18n" }
kv-ipc = { path = "../kv-ipc" }
kv-vault = { path = "../kv-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
rand = "0.8"
hkdf = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"

[target.'cfg(windows)'.dependencies]
kv-platform = { path = "../kv-platform" }
windows-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
windows = { version = "0.62", features = ["Security_Credentials", "Security_Cryptography", "Security_Cryptography_Core", "Storage_Streams", "Win32_System_WinRT"] }
