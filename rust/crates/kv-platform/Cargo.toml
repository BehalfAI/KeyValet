[package]
name = "kv-platform"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[dependencies]
kv-i18n = { path = "../kv-i18n" }
kv-ipc = { path = "../kv-ipc" }
kv-vault = { path = "../kv-vault" }
serde_json = "1"
zeroize = "1"
libc = "0.2"
tokio = { version = "1", features = ["process", "time", "net", "io-util", "sync", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
