[package]
name = "kv-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
kv-i18n = { path = "../kv-i18n" }
libc = "0.2"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
