[package]
name = "kv-mcp"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kv-mcp"
path = "src/main.rs"

[dependencies]
kv-i18n = { path = "../kv-i18n" }
kv-ipc = { path = "../kv-ipc" }
kv-platform = { path = "../kv-platform" }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "process", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-stream = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
futures-util = "0.3"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1"
anyhow = "1"

libc = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
