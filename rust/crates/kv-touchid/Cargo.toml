[package]
name = "kv-touchid"
version = "0.2.1"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kv-touchid"
path = "src/main.rs"

[dependencies]
kv-i18n = { path = "../kv-i18n" }
kv-vault = { path = "../kv-vault" }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
kv-platform = { path = "../kv-platform" }
kv-ipc = { path = "../kv-ipc" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAPublicDefines", "block2"] }
block2 = "0.6"
